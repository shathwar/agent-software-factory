name: Ship Repair Proposal

# Bot feedback is not authorization. Repairs use the same explicit approval and
# independent delivery gates as development, and produce a new draft PR.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number containing the reviewed repair request
        required: true
        type: string
      change:
        description: OpenSpec change ID covering the repair
        required: true
        type: string
      design_commit:
        description: Approved full commit SHA containing the repair design
        required: true
        type: string
      design_digest:
        description: Approved design fingerprint
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  repair:
    uses: ./.github/workflows/ship-dev.yml
    with:
      issue: ${{ inputs.issue }}
      change: ${{ inputs.change }}
      design_commit: ${{ inputs.design_commit }}
      design_digest: ${{ inputs.design_digest }}
      repair: true
    secrets: inherit
