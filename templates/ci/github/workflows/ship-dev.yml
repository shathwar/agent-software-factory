name: Ship Dev Agent

on:
  issues:
    types: [assigned, labeled]
  issue_comment:
    types: [created]

jobs:
  ship-dev:
    # Run when:
    #   1. Issue is assigned
    #   2. Issue is labeled 'ship:ready'
    #   3. Comment contains '@ship' on an open issue (not a PR)
    if: >
      (github.event_name == 'issues' && github.event.action == 'assigned') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ship:ready') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@ship') && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    concurrency:
      group: ship-dev-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Feature Branch & Sponsor Context
        id: context
        run: |
          BRANCH_NAME="feature/issue-${{ github.event.issue.number }}"
          SPONSOR_ACTOR="${{ github.event.sender.login || github.event.issue.user.login }}"
          git config user.name "ship-agent[bot]"
          git config user.email "ship-agent[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          echo "Active branch: $BRANCH_NAME"
          echo "sponsor=$SPONSOR_ACTOR" >> $GITHUB_OUTPUT

      - name: Run Ship Agent Harness
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@ship"
          label_trigger: "ship:ready"
          claude_args: '--max-turns 40 --allowedTools "Edit,Write,Read,MultiEdit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(pytest:*),Bash(python3:*),Bash(npm:*),Bash(npx:*),Bash(ruff:*),Bash(mypy:*)"'
          prompt: |
            You are an autonomous engineering agent operating under the Ship Lifecycle.
            Your task is to implement the requirements described in GitHub Issue #${{ github.event.issue.number }}.
            Accountable Human Sponsor: @${{ steps.context.outputs.sponsor }}

            ## Operational Guidelines

            1. **Understand Architectural Context & Invariants**:
               - Read `ARCHITECTURAL_INVARIANTS.md` and `.agentflow.json` if present in the repository root.
               - Respect the 4 Execution Rings model and "No Orphan Agents" accountability invariant.
               - Read existing files in affected directories to match style, naming conventions, and error handling.
               - Enforce zero third-party bloat (use stdlib or existing project dependencies).

            2. **Real-Time Checkbox Telemetry (CRITICAL)**:
               - The issue body contains markdown checkboxes (`- [ ]`).
               - Inspect current issue body: `gh issue view ${{ github.event.issue.number }} --json body -q .body`
               - As you complete each requirement or test criterion, update the issue body in REAL TIME:
                 `gh issue edit ${{ github.event.issue.number }} --body "<updated_body_with_checked_boxes>"`
               - Update the issue 2 to 4 times during your execution so stakeholders see live progress.

            3. **TDD Rigor (Red-Green-Refactor)**:
               - Write failing automated tests FIRST before modifying or writing implementation code.
               - Verify that tests fail for the expected reason.
               - Implement the minimal code required to turn tests green.
               - Refactor for simplicity, eliminating unnecessary abstractions and tech debt.

            4. **Lifecycle Verification**:
               - Run project test, typecheck, and lint commands.
               - If `skills/ship/scripts/inspect_lifecycle.py` exists, execute:
                 `python3 skills/ship/scripts/inspect_lifecycle.py --status-check`
               - Ensure zero regressions across the codebase.

            5. **Commit & Open Pull Request (Human Sponsor Attribution)**:
               - In accordance with the "No Orphan Agents" invariant, attach human sponsor attribution.
               - Stage all changes and commit with an imperative message and sponsor trailer:
                 `git commit -m "feat(issue-${{ github.event.issue.number }}): <concise summary>" -m "Sponsored-By: @${{ steps.context.outputs.sponsor }}"`
               - Push the feature branch: `git push -u origin feature/issue-${{ github.event.issue.number }}`
               - Open a Pull Request referencing the issue and sponsor:
                 ```bash
                 gh pr create --title "feat: resolve #${{ github.event.issue.number }}" --body "Closes #${{ github.event.issue.number }}
                 Sponsored-By: @${{ steps.context.outputs.sponsor }}

                 ## Summary
                 <summary of technical changes and architectural decisions>

                 ## Completed Requirements
                 - [x] All requirements satisfied and verified

                 ## Verification Evidence
                 - Automated test receipts attached
                 - Zero regressions"
                 ```

      - name: Report Failure Notification
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "⚠️ **Ship Dev Agent encountered an error or timeout**. Please inspect the [workflow run logs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for details." 2>/dev/null || true
